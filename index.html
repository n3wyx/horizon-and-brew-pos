<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#0a0a0a">

  <title>Horizon & Brew POS</title>

  <style>
    :root {
      --background: #080808;
      --surface: #111111;
      --surface-2: #181818;
      --border: #2a2a2a;
      --text: #ffffff;
      --muted: #999999;
      --accent: #ffffff;
      --accent-text: #000000;
      --radius: 12px;
      --font: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: var(--background);
      color: var(--text);
      font-family: var(--font);
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       LOGIN SCREEN
    ========================= */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--background);
    }

    .login-box {
      width: min(420px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 35px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    .login-logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;

      border: 2px solid var(--text);
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 30px;
    }

    .login-box h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: 3px;
    }

    .login-subtitle {
      color: var(--muted);
      margin: 10px 0 28px;
    }

    .pin-display {
      width: 100%;
      height: 55px;

      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);

      color: var(--text);

      font-size: 25px;
      letter-spacing: 10px;

      text-align: center;

      margin-bottom: 18px;
    }

    .login-button {
      width: 100%;
      padding: 15px;

      border: 0;
      border-radius: var(--radius);

      background: var(--accent);
      color: var(--accent-text);

      font-size: 16px;
      font-weight: bold;
    }

    .login-error {
      min-height: 20px;
      margin-top: 12px;
      color: #ff6b6b;
      font-size: 13px;
    }

    /* =========================
       MAIN APP
    ========================= */

    #app {
      display: none;
      min-height: 100vh;
    }

    .topbar {
      height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 20px;

      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;

      border: 2px solid var(--text);
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-name {
      font-weight: bold;
      letter-spacing: 2px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-button {
      background: var(--surface-2);
      color: var(--text);

      border: 1px solid var(--border);
      border-radius: var(--radius);

      padding: 10px 14px;
    }

    .top-button:hover {
      background: var(--accent);
      color: var(--accent-text);
    }

    /* =========================
       NAVIGATION
    ========================= */

    .navigation {
      display: flex;
      gap: 6px;

      padding: 10px 15px;

      background: var(--surface);
      border-bottom: 1px solid var(--border);

      overflow-x: auto;
    }

    .nav-button {
      white-space: nowrap;

      padding: 11px 18px;

      border: 0;
      border-radius: var(--radius);

      background: transparent;
      color: var(--muted);
    }

    .nav-button:hover,
    .nav-button.active {
      background: var(--accent);
      color: var(--accent-text);
    }

    /* =========================
       PAGE
    ========================= */

    .page {
      display: none;
      padding: 20px;
    }

    .page.active {
      display: block;
    }

    .page-title {
      margin: 0 0 5px;
      font-size: 27px;
    }

    .page-subtitle {
      color: var(--muted);
      margin: 0 0 20px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 700px) {

      .brand-name {
        font-size: 13px;
      }

      .topbar {
        padding: 0 12px;
      }

      .page {
        padding: 14px;
      }

      .top-button {
        padding: 9px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOGIN
  ========================= -->

  <section id="loginScreen">

    <div class="login-box">

      <div class="login-logo">
        ✦
      </div>

      <h1>HORIZON & BREW</h1>

      <div class="login-subtitle">
        Point of Sale
      </div>

      <input
        id="pinInput"
        class="pin-display"
        type="password"
        inputmode="numeric"
        maxlength="6"
        placeholder="••••••"
      >

      <button
        class="login-button"
        onclick="login()"
      >
        Unlock POS
      </button>

      <div
        id="loginError"
        class="login-error"
      ></div>

    </div>

  </section>


  <!-- =========================
       MAIN APPLICATION
  ========================= -->

  <div id="app">

    <header class="topbar">

      <div class="brand">

        <div class="brand-logo">
          ✦
        </div>

        <div class="brand-name">
          HORIZON & BREW
        </div>

      </div>

      <div class="top-actions">

        <button
          class="top-button"
          onclick="lockPOS()"
        >
          🔒 Lock
        </button>

      </div>

    </header>


    <nav class="navigation">

      <button
        class="nav-button active"
        onclick="showPage('pos', this)"
      >
        🧾 POS
      </button>

      <button
        class="nav-button"
        onclick="showPage('menu', this)"
      >
        🥤 Menu
      </button>

      <button
        class="nav-button"
        onclick="showPage('goals', this)"
      >
        🎯 Goals
      </button>

      <button
        class="nav-button"
        onclick="showPage('reports', this)"
      >
        📊 Reports
      </button>

      <button
        class="nav-button"
        onclick="showPage('settings', this)"
      >
        ⚙️ Settings
      </button>

    </nav>


    <!-- POS -->

    <main
      id="pos"
      class="page active"
    >

      <h1 class="page-title">
        Register
      </h1>

      <p class="page-subtitle">
        Start a new order.
      </p>

      <div id="posContent"></div>

    </main>


    <!-- MENU -->

    <main
      id="menu"
      class="page"
    >

      <h1 class="page-title">
        Menu
      </h1>

      <p class="page-subtitle">
        Customize your drinks.
      </p>

      <div id="menuContent"></div>

    </main>


    <!-- GOALS -->

    <main
      id="goals"
      class="page"
    >

      <h1 class="page-title">
        Goals
      </h1>

      <p class="page-subtitle">
        Track your sales goals.
      </p>

      <div id="goalsContent"></div>

    </main>


    <!-- REPORTS -->

    <main
      id="reports"
      class="page"
    >

      <h1 class="page-title">
        Reports
      </h1>

      <p class="page-subtitle">
        View your sales information.
      </p>

      <div id="reportsContent"></div>

    </main>


    <!-- SETTINGS -->

    <main
      id="settings"
      class="page"
    >

      <h1 class="page-title">
        Settings
      </h1>

      <p class="page-subtitle">
        Customize Horizon & Brew POS.
      </p>

      <div id="settingsContent"></div>

    </main>

  </div>


  <script>

    /* =========================
       BASIC LOGIN
    ========================= */

    const POS_PIN = "739421";

    function login() {

      const enteredPIN =
        document.getElementById("pinInput").value;

      const error =
        document.getElementById("loginError");

      if (enteredPIN === POS_PIN) {

        document.getElementById("loginScreen").style.display = "none";

        document.getElementById("app").style.display = "block";

        error.textContent = "";

        document.getElementById("pinInput").value = "";

      } else {

        error.textContent =
          "Incorrect PIN. Please try again.";

        document.getElementById("pinInput").value = "";

      }
    }


    function lockPOS() {

      document.getElementById("app").style.display = "none";

      document.getElementById("loginScreen").style.display = "flex";

      document.getElementById("pinInput").value = "";

    }


    /* =========================
       PAGE NAVIGATION
    ========================= */

    function showPage(pageID, button) {

      document
        .querySelectorAll(".page")
        .forEach(page => {
          page.classList.remove("active");
        });

      document
        .getElementById(pageID)
        .classList.add("active");

      document
        .querySelectorAll(".nav-button")
        .forEach(nav => {
          nav.classList.remove("active");
        });

      button.classList.add("active");

    }


    /* ENTER KEY FOR PIN */

    document
      .getElementById("pinInput")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          login();
        }

      });

  </script>

</body>
</html>
